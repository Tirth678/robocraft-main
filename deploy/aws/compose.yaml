# Production stack for the EC2 backend host.
#
# Uploaded by deploy/deploy.sh to /srv/robocraft/compose.yaml, next to:
#   /srv/robocraft/app/          the rsync'd checkout (build context)
#   /srv/robocraft/caddy/Caddyfile
#   /srv/robocraft/backend.env   secrets, never committed
#   /srv/robocraft/.env          SITE_ADDRESS for the Caddyfile
#
# Everything except Caddy is on the compose bridge network and unpublished, so
# the public surface is ports 80/443 only — the same one-port topology as the
# Render container in DEPLOY.md.
name: robocraft

services:
  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: robocraft-backend:local
    env_file:
      - ./backend.env
    environment:
      # scripts/start-backend.sh reads PORT for the gateway; the other six
      # services use their own internal ports and stay unreachable from here.
      PORT: "8081"
      NODE_ENV: "production"
      # Redis lives in this stack, so it overrides any REDIS_URL in backend.env.
      REDIS_URL: "redis://redis:6379"
    expose:
      - "8081"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # `bun` is the only runtime guaranteed inside the image (no curl/wget).
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    # Non-durable cache for cart sessions, plus the BullMQ email queue. AOF is
    # on so a restart does not silently drop queued pre-order confirmations.
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # e.g. robocraft-13-234-56-78.sslip.io — written by deploy.sh from the
      # terraform output. A real domain works here unchanged.
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS missing from /srv/robocraft/.env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  redis_data:
  caddy_data:
  caddy_config:
